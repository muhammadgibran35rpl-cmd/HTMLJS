<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
            background-color: white;
            color: black;
        }
        body.gelap {
            background-color: black;
            color: red;
        }
    </style>
</head>
<body>
    <h1>SMK TELKOM MALANG</h1>
    <p>Berdiri (1992): Sekolah ini didirikan pada 9 Juni 1992 (atau 14 Juni 1992 secara administratif)
        dengan nama awal STM Telkom Sandhy Putra Malang di bawah naungan Yayasan Pendidikan Telkom (YPT).</p>
    <p>Attitude Is Everything</p>

    <button id="btnTema">Mode Gelap</button>

    <script>
        const btnTema = document.getElementById('btnTema');

        btnTema.addEventListener('click', () => {
            document.body.classList.toggle('gelap');

            if (document.body.classList.contains('gelap')) {
            } else {
                btnTema.textContent = 'Mode Gelap'
            }
        });
    </script>
</body>
</html>
