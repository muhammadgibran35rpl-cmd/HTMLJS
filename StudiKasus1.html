<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body.terang {
        background-color: white;
        color: black;
    }

    body.gelap {
        background-color: black;
        color: red;
    }
</style>

<body>
    <h1>SMK TELKOM MALANG</h1>
    <p>Berdiri (1992): Sekolah ini didirikan pada 9 Juni 1992 (atau 14 Juni 1992 secara administratif)
        dengan nama awal STM Telkom Sandhy Putra Malang di bawah naungan Yayasan Pendidikan Telkom (YPT).</p>
    <p>Attitude Is Everything</p>

    <button onclick="gelap()">Tema Gelap</button>
    <button onclick="terang()">Tema Terang</button>

    <script>
        function gelap() {
            document.body.classList.add("gelap")
            document.body.classList.remove("terang")
        }                                                                   
        function terang() {
            document.body.classList.add("terang")
            document.body.classList.remove("gelap")
        }                                                                   
    </script>   
</body>

</html>
